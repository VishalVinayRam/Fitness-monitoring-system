name: life_tracker
description: Personal life tracker - fitness events, plans, and notes with home screen widgets.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Storage & Permissions
  path_provider: ^2.1.3
  permission_handler: ^11.3.1

  # Notifications
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4

  # Home Screen Widgets
  home_widget: ^0.9.0

  # Camera & Images
  image_picker: ^1.1.2

  # Health Connect / Samsung Health bridge (Android) + HealthKit (iOS)
  health: ^13.3.1

  # Utils
  uuid: ^4.5.1
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  flutter_slidable: ^3.1.1
  cached_network_image: ^3.4.1

  # Calendar
  table_calendar: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
